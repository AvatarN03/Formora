<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Formora product preview</title>
  <desc id="desc">Formora landing page with a form composition workspace preview.</desc>
  <rect width="1600" height="960" fill="#f7f4ed"/>
  <rect width="1600" height="66" fill="#f7f4ed" stroke="#e2dcd2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
