    <text x="158" y="254" font-size="104" font-weight="800" letter-spacing="-4">BUILD</text>
    <text x="158" y="362" font-size="104" font-weight="800" letter-spacing="-4">FORMS</text>
    <text x="158" y="470" font-size="104" font-weight="800" letter-spacing="-4">PEOPLE</text>
